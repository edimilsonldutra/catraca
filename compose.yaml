name: catraca

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U catraca -d catraca"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://catraca:catraca@db:5432/catraca
      PORT: "3080"
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-parceiro-demo}
      SESSION_SECRET: ${SESSION_SECRET:-catraca-sessao-local}
    ports:
      - "${APP_PORT:-3080}:3080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  pgdata:
